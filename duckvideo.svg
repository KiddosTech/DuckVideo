<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien Halus ala Material Design -->
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>

    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>

    <!-- Shadow Layer ala Material Elevation -->
    <filter id="materialShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Belakang (Squircle / Rounded Box ala Material You) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#023047" />

  <!-- Layer Bayangan Utama -->
  <g filter="url(#materialShadow)">
    <!-- Badan & Kepala Bebek yang Membentuk Simbol Play (Triangle) -->
    <!-- Elemen Geometris Utama -->
    <path d="M 160,128 
             C 160,128 240,128 300,168 
             C 360,208 400,256 400,256 
             C 400,256 360,304 300,344 
             C 240,384 160,384 160,384 
             Z" 
          fill="url(#duckGrad)" />

    <!-- Paruh Bebek (Aksen Segitiga Play Interaktif) -->
    <path d="M 280,216 
             L 368,256 
             L 280,296 
             C 290,270 290,242 280,216 Z" 
          fill="url(#beakGrad)" />

    <!-- Mata (Material Circle) -->
    <circle cx="230" cy="220" r="18" fill="#023047" />
    <circle cx="236" cy="214" r="6" fill="#FFFFFF" />
  </g>
</svg>
