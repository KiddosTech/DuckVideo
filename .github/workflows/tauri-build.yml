name: Build Tauri Installers

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact-name: duckvideo-linux
            target-triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            artifact-name: duckvideo-windows
            target-triple: x86_64-pc-windows-msvc
          - platform: macos-13
            artifact-name: duckvideo-macos
            target-triple: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Linux sidecars
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o "src-tauri/binaries/yt-dlp-${{ matrix.target-triple }}"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.target-triple }}"
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          file ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.target-triple }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target-triple }}"

      - name: Download Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "src-tauri/binaries/yt-dlp-${{ matrix.target-triple }}.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"
          Copy-Item "ffmpeg/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" "src-tauri/binaries/ffmpeg-${{ matrix.target-triple }}.exe"

      - name: Download macOS sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o "src-tauri/binaries/yt-dlp-${{ matrix.target-triple }}"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.target-triple }}"
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          file ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-macos64-gpl/bin/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.target-triple }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target-triple }}"

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
